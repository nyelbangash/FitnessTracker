<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Fitness Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0a0a;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 1rem;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0a0a0a;
        }
        
        p {
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .button {
            background: linear-gradient(135deg, #0a0a0a 0%, #374151 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .features {
            margin-top: 2rem;
            text-align: left;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .feature-icon {
            width: 1rem;
            height: 1rem;
            background: #10b981;
            border-radius: 50%;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            🏋️
        </div>
        
        <h1>You're Offline</h1>
        <p>Don't worry! You can still use many features of Fitness Tracker while offline. Your data will sync when you're back online.</p>
        
        <a href="/" class="button" onclick="window.location.reload()">
            Try Again
        </a>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon"></div>
                View previously loaded workouts and meals
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                Create new workouts (will sync later)
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                Log meals offline
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                Use the plate calculator
            </div>
        </div>
    </div>

    <script>
        // Auto-retry connection
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            }
        }
        
        // Check every 30 seconds
        setInterval(checkConnection, 30000);
        
        // Listen for online event
        window.addEventListener('online', checkConnection);
    </script>
</body>
</html>
